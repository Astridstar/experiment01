[project]
name = "data_cleansing_experiment01"
version = "0.0.1"
authors = [{ name = "pandawss@hotmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "databricks-labs-pytester>=0.7",
    "ipykernel",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a live Databricks workspace (DATABRICKS_HOST or ~/.databrickscfg).",
]
testpaths = ["src/data_cleansing_experiment01_etl/tests"]

[project.scripts]
main = "data_cleansing_experiment01.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
